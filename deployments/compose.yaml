services:
  backend:
    container_name: lib-go-serv
    image: lib-go
    build: 
      context: ..
      dockerfile: build/package/Dockerfile
    depends_on:
      - storage
    ports:
      - "8080:8080"
    environment:
      - SSL_MODE=${SSL_MODE}
      - POSTGRES_URL=${POSTGRES_URL}
    env_file:
        - ../.env-compose

  storage:
    restart: always
    container_name: lib-psql-serv
    image: postgres:16
    env_file:
        - ../.env-compose
    environment:
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${DB_USER}"
      - "POSTGRES_DB=${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - ../third_party/postgres/.database/postgresql/data:/var/lib/postgresql/data

volumes:
  storage:
